name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed macOS release
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Verify stable release tag
        if: github.event_name == 'push'
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME" stable
      - name: Prepare release build without signing credentials
        run: npm run package:mac:release:prepare

      - name: Require signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"

      - name: Build signed Apple Silicon and Intel updates
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          export APPLE_API_KEY="$api_key_path"
          trap 'rm -f "$api_key_path"' EXIT
          npm run package:mac:release:dist
          release_version=$(node -p "require('./package.json').version")
          dmg_paths=(
            "release/Lane-${release_version}-mac-arm64.dmg"
            "release/Lane-${release_version}-mac-x64.dmg"
          )
          for dmg_path in "${dmg_paths[@]}"; do
            test -f "$dmg_path"
            xcrun notarytool submit "$dmg_path" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --timeout 30m
            xcrun stapler staple "$dmg_path"
          done
          npm run finalize:mac:update-metadata

      - name: Verify signatures and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/verify-signed-macos.sh

      - name: Run installed Apple Silicon product E2E
        env:
          LANE_E2E_ARCH: arm64
        run: npm run e2e:dmg:mac
      - name: Upload Apple Silicon E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-E2E-arm64-${{ github.run_id }}
          path: |
            playwright-report
            test-results/e2e
          if-no-files-found: ignore

      - name: Create checksums
        run: |
          cd release
          shasum -a 256 Lane-*-mac-*.dmg Lane-*-mac-*.zip > SHA256SUMS

      - name: Stage verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-${{ github.run_id }}-stable
          path: |
            release/Lane-*-mac-*.dmg
            release/Lane-*-mac-*.zip
            release/latest-mac.yml
            release/*.blockmap
            release/SHA256SUMS
          if-no-files-found: error

  intel-e2e:
    name: Run installed Intel product E2E
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Lane-${{ github.run_id }}-stable
          path: release
      - name: Run Intel DMG E2E
        env:
          LANE_E2E_ARCH: x64
        run: npm run e2e:dmg:mac
      - name: Upload Intel E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-E2E-x64-${{ github.run_id }}
          path: |
            playwright-report
            test-results/e2e
          if-no-files-found: ignore

  publish:
    name: Publish stable release
    needs: [build, intel-e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Lane-${{ github.run_id }}-stable
          path: release
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release/Lane-*-mac-*.dmg
            release/Lane-*-mac-*.zip
            release/latest-mac.yml
            release/*.blockmap
            release/SHA256SUMS
          )
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Lane $GITHUB_REF_NAME"
