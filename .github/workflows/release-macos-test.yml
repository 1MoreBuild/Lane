name: macOS Test Release

on:
  workflow_dispatch:
  push:
    tags: ["v*-test.*"]

permissions:
  contents: write

concurrency:
  group: macos-test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Build unsigned universal DMG
        run: npm run package:mac:test

      - name: Smoke test packaged app and CLI
        env:
          LANE_SMOKE_ARCH: universal
        run: |
          npm run smoke:mac
          npm run smoke:cli:mac

      - name: Install and launch from DMG
        run: npm run smoke:dmg:mac

      - name: Create checksum
        run: |
          cd release
          shasum -a 256 ./*.dmg > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lane-${{ github.ref_name }}-macOS-test
          path: |
            release/*.dmg
            release/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.dmg \
            release/SHA256SUMS \
            --prerelease \
            --title "Lane $GITHUB_REF_NAME (Unsigned Test Build)" \
            --notes-file docs/TEST_BUILDS.md
