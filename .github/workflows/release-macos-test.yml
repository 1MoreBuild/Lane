name: macOS Test Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable SemVer tag to publish as an unsigned prerelease
        required: true
        type: string
      confirm_unsigned:
        description: Type UNSIGNED to confirm this is not an Apple-trusted release
        required: true
        type: string
  push:
    tags: ["v*-test.*"]

permissions:
  contents: read

concurrency:
  group: macos-test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            arch: arm64
            runner: macos-latest
          - name: Intel
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Read package version
        run: node -p '"PACKAGE_VERSION=" + require("./package.json").version' >> "$GITHUB_ENV"

      - name: Verify release tag
        env:
          CONFIRM_UNSIGNED: ${{ inputs.confirm_unsigned }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$CONFIRM_UNSIGNED" = "UNSIGNED"
            node scripts/verify-release-tag.mjs "$RELEASE_TAG" preview
          else
            node scripts/verify-release-tag.mjs "$RELEASE_TAG" test
          fi

      - name: Build ad-hoc signed ${{ matrix.name }} DMG
        run: npm run package:mac:${{ matrix.arch }}

      - name: Verify complete app bundle signature
        run: |
          app_path=$(find release -type d -name Lane.app -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign -dvv "$app_path" 2>&1 | grep -q "Signature=adhoc"

      - name: Run installed product E2E
        env:
          LANE_E2E_ARCH: ${{ matrix.arch }}
        run: npm run e2e:dmg:mac
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-E2E-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            playwright-report
            test-results/e2e
          if-no-files-found: ignore

      - name: Create checksum
        run: |
          cd release
          shasum -a 256 "./Lane-${PACKAGE_VERSION}-mac-${{ matrix.arch }}.dmg" \
            > "SHA256SUMS-${{ matrix.arch }}"

      - name: Upload workflow artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-macOS-${{ matrix.arch }}-test-${{ github.run_id }}
          path: |
            release/*-mac-${{ matrix.arch }}.dmg
            release/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Lane-macOS-*-test-${{ github.run_id }}
          path: release
          merge-multiple: true

      - name: Combine checksums
        run: cat release/SHA256SUMS-arm64 release/SHA256SUMS-x64 > release/SHA256SUMS

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_title="Lane $RELEASE_TAG (Unsigned Preview)"
          else
            release_title="Lane $RELEASE_TAG (Unsigned Test Build)"
          fi
          gh release create "$RELEASE_TAG" \
            release/*.dmg \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$release_title" \
            --notes-file docs/TEST_BUILDS.md
