name: macOS Test Release

on:
  workflow_dispatch:
  push:
    tags: ["v*-test.*"]

permissions:
  contents: read

concurrency:
  group: macos-test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            arch: arm64
            runner: macos-latest
          - name: Intel
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Read package version
        run: node -p '"PACKAGE_VERSION=" + require("./package.json").version' >> "$GITHUB_ENV"

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Build unsigned ${{ matrix.name }} DMG
        run: npm run package:mac:${{ matrix.arch }}

      - name: Smoke test packaged app and CLI
        env:
          LANE_SMOKE_ARCH: ${{ matrix.arch }}
        run: |
          npm run smoke:mac
          npm run smoke:cli:mac

      - name: Install and launch from DMG
        env:
          LANE_SMOKE_ARCH: ${{ matrix.arch }}
        run: npm run smoke:dmg:mac

      - name: Create checksum
        run: |
          cd release
          shasum -a 256 "./Lane-${PACKAGE_VERSION}-mac-${{ matrix.arch }}.dmg" \
            > "SHA256SUMS-${{ matrix.arch }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-${{ github.ref_name }}-macOS-${{ matrix.arch }}-test
          path: |
            release/*-mac-${{ matrix.arch }}.dmg
            release/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Lane-${{ github.ref_name }}-macOS-*-test
          path: release
          merge-multiple: true

      - name: Combine checksums
        run: cat release/SHA256SUMS-arm64 release/SHA256SUMS-x64 > release/SHA256SUMS

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.dmg \
            release/SHA256SUMS \
            --prerelease \
            --title "Lane $GITHUB_REF_NAME (Unsigned Test Build)" \
            --notes-file docs/TEST_BUILDS.md
