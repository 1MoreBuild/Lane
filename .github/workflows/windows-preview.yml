name: Windows Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Build unsigned x64 NSIS preview
        run: npm run package:win
      - name: Run installed x64 product E2E
        run: npm run e2e:nsis:win
      - name: Create checksum
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/Lane-$version-windows-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  Lane-$version-windows-setup.exe" | Set-Content release/SHA256SUMS-windows

      - name: Upload x64 E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-E2E-Windows-x64-${{ github.run_id }}
          path: |
            playwright-report
            test-results/e2e
          if-no-files-found: ignore

      - name: Upload unsigned Windows preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lane-Windows-unsigned-${{ github.run_id }}
          path: |
            release/Lane-*-windows-setup.exe
            release/Lane-*-windows-setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 14
